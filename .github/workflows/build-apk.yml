name: "Build Nagham Music APK"
'on':
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract project
    shell: bash
    run: |
      unzip -o nagham-music-app-development.zip -d extracted
      PROJECT_DIR="$(dirname "$(find extracted -name package.json -print -quit)")"
      if [ ! -f "$PROJECT_DIR/package.json" ]; then
        echo "package.json not found"
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build web app
    run: |
      cd "$PROJECT_DIR"
      npm install
      npm run build

  - name: Prepare Android
    run: |
      cd "$PROJECT_DIR"
      npm install @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3
      if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
        printf '{"appId":"com.nagham.music","appName":"Nagham Music","webDir":"dist"}' > capacitor.config.json
      fi
      if [ ! -d android ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
        rm -rf android
        npx cap add android
      fi
      npx cap sync android

  - name: Build APK
    run: |
      cd "$PROJECT_DIR/android"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Nagham-Music-APK
      path: "${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
